[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["venv", "node_modules", "build", "research", "ai/fingerspelling/dataset"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"ai/fingerspelling/collect_data.py" = ["E402"]
"ai/fingerspelling/inference.py" = ["E402"]
"ai/fingerspelling/realtime_inference.py" = ["E402"]
"ai/fingerspelling/train.py" = ["E402"]
